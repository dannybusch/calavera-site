# ------------------------------------------------------------------
#  Calavera-Adventskalender 2026  →  www.calavera.club/adventskalender/
#  Pro Tag eine Tür: ein Lieblingssong von jemandem aus dem Team oder von den DJs.
#
#  Diese Datei wird NIE ausgeliefert. build.py schreibt nur die Türen ins HTML, deren Tag schon
#  erreicht ist (Bremer Zeit). Von künftigen Türen steht nichts auf der Seite – nur Zahl und Datum.
#  Eine Tür erscheint erst, wenn song, kuenstler und person ausgefüllt sind; sonst „folgt in Kürze“.
#  Neue Tür: der Deploy läuft vom 1. bis 24.12. zusätzlich kurz nach Mitternacht.
#  Testen:  python build.py --now "2026-12-07 12:00" --serve
#  Texte in "Anführungszeichen" setzen (wegen : und # im Text).
# ------------------------------------------------------------------

draft: false                                   # true = Seite wird nicht gebaut. Zum Start auf false setzen
                                              #   (und Menüpunkt in config.yml → navigation ergänzen)
jahr: 2026
titel: "24 Türen. 24 Lieblingssongs."         # große Überschrift (letzter Satz erscheint rot)
kicker: "Calavera · Advent 2026"              # kleine Zeile darüber
einleitung: "Jeden Tag ein neuer Lieblingssong von den Menschen, die für euch unvergessliche Calavera-Nächte zaubern."                                # 1–3 Sätze unter der Überschrift (leer = keine)
seo_title: "Musik Adventskalender 2026 aus dem Calavera Bremen"             # Titel im Browser-Tab und bei Google (" · Calavera Bremen" kommt dazu)
description: ""                               # ein Satz für Google, höchstens ca. 155 Zeichen (sonst: Einleitung)
startseite_ab: 2026-11-26
startseite_bis: 2026-12-30

# So sieht eine ausgefüllte Tür aus (Werte hier nur Beispiele für das Format):
#
#  - tag: 1
#    song: "Titel des Songs"
#    kuenstler: "Name der Band / Künstler:in"
#    erschienen: 1987                         # optional: Erscheinungsjahr
#    person: "Vorname oder DJ-Name"
#    rolle: DJ                                # DJ oder Team
#    text: "Zwei bis vier Sätze von der Person selbst: warum dieser Song, was er mit dem Calavera zu tun hat."
#                                             # (Markdown geht: *kursiv*, **fett**, [Link](https://…))
#    links:                                   # nur ausfüllen, was es gibt – Reihenfolge = Reihenfolge der Knöpfe,
#      youtube_music: "https://music.youtube.com/watch?v=…"   #   der erste Knopf ist rot
#      bandcamp: "https://….bandcamp.com/track/…"
#      spotify: "https://open.spotify.com/track/…"
#      # apple_music, tidal, soundcloud, deezer gehen auch
#      # andere Dienste:  andere: [{name: "Mixcloud", url: "https://…"}]

