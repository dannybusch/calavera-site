# ------------------------------------------------------------------
#  Calavera Bremen – Website bauen und per SFTP veröffentlichen
#
#  Läuft
#    - bei jedem Push auf den Branch "main"
#    - täglich nach Clubschluss (damit Vergangenes ins Archiv wandert)
#    - von Hand: GitHub → Actions → "Bauen und veröffentlichen" → "Run workflow"
#      (dort standardmäßig als Probelauf: zeigt nur an, was passieren würde)
#
#  Einrichtung siehe README, Abschnitt "Automatisch veröffentlichen".
#  Benötigt im Repository (Settings → Secrets and variables → Actions):
#    Variables:  SFTP_HOST, SFTP_USER, SFTP_REMOTE_DIR   (optional: SFTP_PORT)
#    Secrets:    SFTP_PASSWORD                            (optional: SFTP_KNOWN_HOSTS)
# ------------------------------------------------------------------

name: Bauen und veröffentlichen

on:
  push:
    branches: [main]
    # Reels und Bilder gehören nicht zur Website – Änderungen daran lösen keine Veröffentlichung aus
    paths-ignore:
      - "reels/**"
      - "reels.py"
      - "requirements-reels.txt"
      - ".github/workflows/reels.yml"
      - "media/**"
      - "media.py"
      - ".github/workflows/media.yml"
      - "rausgegangen.py"
      - ".github/workflows/rausgegangen.yml"
      - "events/*.mp3"
      - "events/*.m4a"
      - "events/*.wav"
  schedule:
    # GitHub rechnet in UTC: 04:17 UTC = 05:17 Uhr Winterzeit / 06:17 Uhr Sommerzeit.
    # (Ungerade Minute, weil GitHub zur vollen Stunde oft stark verzögert.)
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probelauf – nur anzeigen, was hochgeladen und gelöscht würde"
        type: boolean
        default: true
      alles:
        description: "Alles neu hochladen (sonst nur Dateien, deren Inhalt sich geändert hat)"
        type: boolean
        default: false

# Nie zwei Veröffentlichungen gleichzeitig; eine laufende wird zu Ende gebracht.
concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    # Feste Version statt ubuntu-latest: das neue Ubuntu 26.04 ("resolute") erreichte seine Paketquellen nicht
    runs-on: ubuntu-24.04
    # Variablen und Secrets kommen aus diesem GitHub-Environment (Settings → Environments)
    environment: calavera-site.env
    timeout-minutes: 20

    env:
      SFTP_HOST: ${{ vars.SFTP_HOST }}
      SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
      SFTP_USER: ${{ vars.SFTP_USER }}
      SFTP_REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR }}
      # "true", wenn der SFTP-Zugang bei STRATO nur den Ordner von www.calavera.club sieht –
      # dann ist SFTP_REMOTE_DIR "/" erlaubt (siehe README)
      SFTP_USER_IS_WEBROOT: ${{ vars.SFTP_USER_IS_WEBROOT }}
      # Probelauf nur bei manuellem Start mit Häkchen; Push und Zeitplan veröffentlichen immer.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Website bauen
        # --strict: bricht ab, wenn eine Event-Datei fehlerhaft ist – dann wird nichts veröffentlicht
        run: python build.py --strict

      - name: Einstellungen prüfen
        env:
          HAS_PASSWORD: ${{ secrets.SFTP_PASSWORD != '' }}
        run: |
          missing=""
          [ -n "$SFTP_HOST" ]       || missing="$missing SFTP_HOST"
          [ -n "$SFTP_USER" ]       || missing="$missing SFTP_USER"
          [ -n "$SFTP_REMOTE_DIR" ] || missing="$missing SFTP_REMOTE_DIR"
          [ "$HAS_PASSWORD" = "true" ] || missing="$missing SFTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Es fehlen Einstellungen:$missing (siehe README, 'Automatisch veröffentlichen')"
            exit 1
          fi
          # Schutz: niemals das Wurzelverzeichnis eines Zugangs spiegeln, der den ganzen Webspace sieht –
          # dort liegen auch andere Seiten (z. B. live.calavera.club), die sonst gelöscht würden.
          # Ausnahme: eigener SFTP-Zugang, der nur den Ordner von www.calavera.club sieht
          # (Variable SFTP_USER_IS_WEBROOT = true).
          # shellcheck disable=SC2088  # "~" soll hier wörtlich verglichen werden
          case "$SFTP_REMOTE_DIR" in
            "/"|"."|"./"|"~"|"~/")
              if [ "$SFTP_USER_IS_WEBROOT" = "true" ]; then
                echo "SFTP_USER_IS_WEBROOT=true: Zugang sieht nur www.calavera.club – Wurzelverzeichnis ist erlaubt."
              else
                echo "::error::SFTP_REMOTE_DIR zeigt auf das Wurzelverzeichnis. Entweder den Ordner von www.calavera.club angeben oder – wenn der SFTP-Zugang nur diesen Ordner sieht – die Variable SFTP_USER_IS_WEBROOT auf true setzen."
                exit 1
              fi ;;
          esac
          echo "Ziel: $SFTP_USER@$SFTP_HOST (Port $SFTP_PORT), Ordner: $SFTP_REMOTE_DIR  –  Probelauf: $DRY_RUN"

      - name: Server-Schlüssel hinterlegen
        env:
          KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            # Sicher: fest hinterlegter Fingerabdruck des STRATO-Servers
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Bequem: Schlüssel beim ersten Kontakt abfragen (siehe README, wie man ihn fest hinterlegt)
            echo "::warning::SFTP_KNOWN_HOSTS ist nicht gesetzt – Server-Schlüssel wird ungeprüft übernommen."
            ssh-keyscan -p "$SFTP_PORT" -T 15 "$SFTP_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "::error::Server-Schlüssel von $SFTP_HOST nicht erhalten"; exit 1; }

      - name: Hochladen (SFTP)
        # hochladen.py (Python, kein apt nötig): lädt nur Dateien hoch, deren Inhalt sich geändert hat,
        # entfernt auf dem Server, was es in dist/ nicht mehr gibt, und lässt .htaccess, .well-known/
        # und _behalten/ unangetastet. Server-Schlüssel wird gegen ~/.ssh/known_hosts geprüft.
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          ALLES: ${{ github.event_name == 'workflow_dispatch' && inputs.alles && 'true' || 'false' }}
        run: |
          pip install -q "paramiko>=3.4"
          args=(dist/ "$SFTP_REMOTE_DIR")
          [ "$DRY_RUN" = "true" ] && args+=(--probe)
          [ "$ALLES" = "true" ] && args+=(--alles)
          python hochladen.py "${args[@]}"

      # ── Alternative mit lftp (früher Standard; braucht apt, das bei GitHub zeitweise klemmte) ──
      # Zum Zurückwechseln: Schritt oben auskommentieren, diese beiden einkommentieren.
      #
      # - name: lftp installieren
      #   run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      #
      # - name: Hochladen (SFTP, lftp)
      #   env:
      #     LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      #   run: |
      #     DRY=""
      #     [ "$DRY_RUN" = "true" ] && DRY="--dry-run"
      #     lftp -c "
      #       set cmd:fail-exit yes
      #       set net:max-retries 3
      #       set net:timeout 30
      #       set net:reconnect-interval-base 5
      #       set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts'
      #       open --env-password -u '$SFTP_USER' -p $SFTP_PORT 'sftp://$SFTP_HOST'
      #       mirror --reverse --delete --overwrite --verbose=1 --parallel=4 $DRY \
      #         --exclude-glob .htaccess \
      #         --exclude-glob .calavera-pruefsummen.json \
      #         --exclude .well-known/ \
      #         --exclude _behalten/ \
      #         dist/ '$SFTP_REMOTE_DIR'
      #     "

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### Calavera-Website"
            echo "- Anlass: \`${{ github.event_name }}\`"
            echo "- Probelauf: \`$DRY_RUN\`"
            if [ -f dist/build.json ]; then
              echo "- Build:"; echo '```json'; cat dist/build.json; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
