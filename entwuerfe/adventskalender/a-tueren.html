<!doctype html>
<html lang="de" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwurf A · Türen im Raster · Adventskalender · Calavera</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../static/img/calavera_logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../static/css/site.css">
<style>
/* ===== Entwurf A – „Türen im Raster“: nah an den Programm-Kacheln, Türen klappen in 3D auf ===== */
.ph-band { position: sticky; top: 0; z-index: 50; background: #e9c46a; color: #1a1a1a; font: 500 12px/1 var(--mono); letter-spacing: .1em;
  text-transform: uppercase; text-align: center; padding: 8px 12px; }
.ph { text-decoration: underline dotted rgba(233,196,106,.7); text-underline-offset: 4px; text-decoration-thickness: 1.5px; }

.adv-hero { padding-top: calc(var(--logo-h) - var(--bar-h) + 54px); padding-bottom: 40px; display: grid; gap: 22px; }
.adv-hero .display--page { max-width: 12ch; }
.adv-hero .display--page em { font-style: normal; color: var(--accent-display); }
.adv-meta { display: flex; flex-wrap: wrap; gap: 8px; }

.adv-grid { --cols: 6; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-auto-rows: minmax(150px, 1fr);
  grid-auto-flow: dense; gap: var(--gap); padding-bottom: 96px; }
.door { position: relative; min-width: 0; border: 0; padding: 0; margin: 0; background: none; color: inherit; font: inherit; text-align: left;
  cursor: pointer; perspective: 900px; perspective-origin: 0 50%; border-radius: var(--radius); overflow: hidden; }
.door.w2 { grid-column: span 2; }
.door.h2 { grid-row: span 2; }

/* Innenseite: das, was hinter der Tür liegt */
.door-in { position: absolute; inset: 0; border-radius: var(--radius); background: var(--surface-3); overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 16px 16px 16px 31%;
  box-shadow: inset 0 0 0 1px #2c2a29; }
.door-in .di-num { position: absolute; top: 12px; right: 14px; font: 500 12px/1 var(--mono); letter-spacing: .1em; color: var(--muted); }
.door-in .di-song { font-family: var(--display); font-size: 26px; line-height: 1; text-transform: uppercase; color: var(--text); overflow-wrap: break-word; }
.door-in .di-by { font-size: 14px; color: var(--text-3); }
.door-in .di-play { margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--mono); letter-spacing: .1em;
  text-transform: uppercase; color: var(--accent-text); }
.door.h2 .door-in .di-song { font-size: 40px; }

/* Vorderseite: die Tür selbst */
.door-front { position: absolute; inset: 0; border-radius: var(--radius); background: var(--surface-1); transform-origin: 0 50%;
  transition: transform .9s cubic-bezier(.2,.7,.2,1), background .2s ease; backface-visibility: hidden; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between; padding: 14px 16px; box-shadow: inset 0 0 0 1px #2c2a29; }
.door-front::before { /* Türfüllung */ content: ""; position: absolute; inset: 10px; border-radius: 3px; box-shadow: inset 0 0 0 1px #1f1e1d; pointer-events: none; }
.door-front::after { /* Knauf */ content: ""; position: absolute; right: 18px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%;
  background: #34302c; box-shadow: 0 1px 0 rgba(255,255,255,.06); }
.df-num { position: relative; font-family: var(--display); font-size: clamp(56px, 6vw, 88px); line-height: .82; color: #3a3632; }
.door.h2 .df-num { font-size: clamp(110px, 13vw, 200px); }
.df-lab { position: relative; display: flex; align-items: center; gap: 6px; font: 400 11px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.door:hover .door-front { background: #191919; }
.door.is-zu .door-front { cursor: not-allowed; }

/* Heute: rote Tür, leises Pulsieren (nur opacity) */
.door.is-heute .door-front { background: var(--accent); box-shadow: none; }
.door.is-heute .door-front::before { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.door.is-heute .door-front::after { background: #f1ebe2; }
.door.is-heute .df-num { color: #f1ebe2; }
.door.is-heute .df-lab { color: #f6dfe2; }
.door.is-heute::after { content: ""; position: absolute; inset: -6px; border-radius: 10px; box-shadow: 0 0 34px 4px var(--glow); opacity: 0;
  animation: puls 2.4s ease-in-out infinite; pointer-events: none; }
@keyframes puls { 50% { opacity: 1; } }

/* Offen: Tür steht angelehnt */
.door.is-offen .door-front { transform: rotateY(74deg); background: #1a1918;
  box-shadow: inset 0 0 0 1px #2c2a29, inset -60px 0 50px rgba(0,0,0,.55); }
.door.is-offen .df-lab, .door.is-offen .door-front::after { opacity: 0; }
.door.is-offen:hover .door-front { transform: rotateY(79deg); }
.door.is-offen:hover .di-song { color: var(--accent-text); }

.door.wackeln .door-front { animation: wackeln .45s ease; }
@keyframes wackeln { 20% { transform: rotateY(9deg); } 45% { transform: rotateY(2deg); } 70% { transform: rotateY(6deg); } 100% { transform: none; } }

/* Hinweis bei geschlossener Tür */
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 60; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--surface-3); color: var(--text); padding: 12px 18px; border-radius: 999px; font: 500 13px/1.3 var(--mono); letter-spacing: .04em;
  box-shadow: inset 0 0 0 1px #34302c, 0 18px 40px rgba(0,0,0,.6); transition: opacity .2s, transform .2s; }
.toast.zeigen { opacity: 1; transform: translate(-50%, 0); }

/* ===== Geöffnete Tür ===== */
dialog.adv { width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 0; border-radius: 10px;
  background: var(--surface-1); color: var(--text); box-shadow: 0 40px 120px rgba(0,0,0,.8), inset 0 0 0 1px #2c2a29; overflow: auto; }
dialog.adv::backdrop { background: rgba(5,5,5,.82); backdrop-filter: blur(3px); }
dialog.adv[open] { animation: auf .45s cubic-bezier(.2,.7,.2,1); }
@keyframes auf { from { opacity: 0; transform: translateY(18px) scale(.98); } }
.adv-wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 520px; }
.adv-side { position: relative; background: var(--accent); color: #f1ebe2; padding: 26px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.adv-side img { position: absolute; right: -70px; bottom: -40px; width: 320px; opacity: .14; filter: grayscale(1) brightness(2.2); }
.as-num { position: relative; font-family: var(--display); font-size: 220px; line-height: .78; }
.as-lab { position: relative; font: 500 13px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.adv-body { padding: 30px 34px 26px; display: flex; flex-direction: column; gap: 18px; }
.ab-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.ab-x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-3); color: var(--text); cursor: pointer; display: grid; place-items: center; }
.ab-x:hover { background: #262626; }
.chip--ph { background: transparent; color: #e9c46a; box-shadow: inset 0 0 0 1px rgba(233,196,106,.5); }
.ab-song { margin: 0; font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(48px, 6vw, 84px); line-height: .9; }
.ab-song:focus { outline: none; }
.ab-artist { margin: -6px 0 0; font-size: 20px; color: var(--text-2); }
.ab-who { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ab-ava { width: 52px; height: 52px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; flex: 0 0 auto;
  box-shadow: inset 0 0 0 1px #34302c; font-family: var(--display); font-size: 22px; color: var(--muted); }
.ab-who p { margin: 0; line-height: 1.35; }
.ab-who .label { display: block; margin-bottom: 2px; }
.ab-text { margin: 0; font-size: 17px; line-height: 1.6; color: var(--text-2); max-width: 60ch; }
.ab-links { display: flex; flex-wrap: wrap; gap: 8px; }
.ab-links .btn { min-height: 44px; padding: 0 18px; }
.ab-nav { margin-top: auto; display: flex; justify-content: space-between; gap: 8px; padding-top: 6px; }
.ab-nav button { background: none; border: 0; color: var(--text-3); font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; padding: 10px 0; }
.ab-nav button:hover { color: var(--text); }
.ab-nav button:disabled { opacity: .3; cursor: default; }

@media (max-width: 1100px) { .adv-grid { --cols: 4; } .door.w2:not(.h2) { grid-column: span 1; } .door.keep { grid-column: span 2; } }
@media (max-width: 760px) {
  .adv-grid { --cols: 3; grid-auto-rows: minmax(112px, 1fr); }
  .door.w2:not(.h2) { grid-column: span 1; }
  .door-in { padding-left: 24%; padding-top: 30px; padding-right: 8px; }
  .door-in .di-song { font-size: 18px; } .door.h2 .door-in .di-song { font-size: 28px; }
  .door-in .di-by, .door-in .di-play { display: none; }
  .door.is-offen .door-front { transform: rotateY(80deg); }
  .df-lab span { display: none; }
  .adv-wrap { grid-template-columns: 1fr; min-height: 0; }
  .adv-side { flex-direction: row; align-items: flex-end; padding: 18px 20px; }
  .adv-side img { width: 180px; right: -30px; bottom: -30px; }
  .as-num { font-size: 120px; }
  .adv-body { padding: 20px; }
}
@media (prefers-reduced-motion: reduce) { .door-front, dialog.adv[open] { transition: none; animation: none; } .door.is-heute::after { animation: none; opacity: .6; } }
</style>
</head>
<body>
<div class="ph-band">Entwurf A · Daten aus advent/adventskalender2026.yml · leere Felder = Platzhalter (gepunktet)</div>
<header class="site-header">
  <div class="bar wrap">
    <a class="brand" href="#" aria-label="Calavera – Startseite"><span class="brand-rod" aria-hidden="true"></span><span class="brand-rod brand-rod--r" aria-hidden="true"></span>
      <img src="../../static/img/calavera_logo.svg" alt="Calavera" width="1024" height="789"></a>
    <nav class="nav" id="hauptmenue" aria-label="Hauptmenü"><ul><li><a href="#">Programm</a></li><li><a href="#" aria-current="page">Advent</a></li><li><a href="#">Über uns</a></li><li><a href="#">Kontakt</a></li></ul></nav>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="hauptmenue"><span class="menu-label">Menü</span>
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path class="i-open" d="M4 7h16M4 12h16M4 17h16"/><path class="i-close" d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</header>

<main class="site-main">
  <section class="wrap adv-hero">
    <p class="kicker" id="kicker">Calavera · Advent 2026</p>
    <h1 class="display display--page" id="titel">24 Türen. <em>24 Lieblingssongs.</em></h1>
    <p class="lead" id="lead"></p>
    <div class="adv-meta"><span class="chip chip--strong" id="stand"></span><span class="chip" id="uhr"></span></div>
  </section>
  <section class="wrap"><div class="adv-grid" id="grid"></div></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="adv" id="dlg" aria-labelledby="dlg-song">
  <div class="adv-wrap">
    <div class="adv-side"><img src="../../static/img/calavera_logo.svg" alt=""><span class="as-lab" id="dlg-datum"></span><span class="as-num" id="dlg-num"></span></div>
    <div class="adv-body">
      <div class="ab-top"><span><span class="chip chip--ph" id="dlg-ph">Platzhalter</span></span><button class="ab-x" type="button" data-zu aria-label="Schließen"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <h2 class="ab-song" id="dlg-song" tabindex="-1" autofocus></h2>
      <p class="ab-artist" id="dlg-artist"></p>
      <div class="ab-who"><span class="ab-ava" id="dlg-ava"></span><p><span class="label">Ausgewählt von</span><strong id="dlg-person"></strong> <span class="muted" id="dlg-rolle"></span></p></div>
      <p class="ab-text" id="dlg-text"></p>
      <div><p class="label" style="margin:0 0 10px">Anhören bei</p><div class="ab-links" id="dlg-links"></div></div>
      <div class="ab-nav"><button type="button" id="dlg-prev">← Vorige Tür</button><button type="button" id="dlg-next">Nächste Tür →</button></div>
    </div>
  </div>
</dialog>

<script src="../../static/js/js-yaml.min.js"></script>
<script src="daten-yml.js"></script>
<script>
(function () {
  var grid = document.getElementById("grid"), dlg = document.getElementById("dlg"), aktuell = 0, A;
  var GROSS = { 24: "w2 h2", 6: "w2 keep", 13: "w2", 19: "w2" };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function setz(id, f) { var el = document.getElementById(id); el.textContent = f.wert; el.classList.toggle("ph", f.ph); }
  function phs(f) { return '<span class="' + (f.ph ? "ph" : "") + '">' + esc(f.wert) + '</span>'; }

  adventLaden().then(start).catch(function (err) {
    document.querySelector(".adv-meta").hidden = true;
    grid.innerHTML = '<p class="lead" style="grid-column:1/-1">Die Datei <code>advent/adventskalender2026.yml</code> konnte nicht geladen werden (' + esc(err.message) +
      '). Bitte über einen Webserver öffnen: im Projektordner <code>python -m http.server 8001</code>, dann <code>http://localhost:8001/entwuerfe/adventskalender/a-tueren.html</code>.</p>';
  });

  function start(daten) {
    A = daten;
    // Kopf aus der YAML: letzter Satz der Überschrift rot
    setz("kicker", A.kicker); setz("lead", A.einleitung);
    var teile = A.titel.wert.match(/[^.!?]+[.!?]*\s*/g) || [A.titel.wert], h1 = document.getElementById("titel");
    h1.innerHTML = teile.length > 1 ? esc(teile.slice(0, -1).join("")) + "<em>" + esc(teile[teile.length - 1]) + "</em>" : esc(A.titel.wert);
    var offen = Math.max(0, Math.min(A.heute, 24));
    document.getElementById("stand").textContent = offen >= 24 ? "Alle 24 Türen offen" : offen + " von 24 Türen offen";
    document.getElementById("uhr").textContent = "Neue Tür täglich um " + A.oeffnet_um;

    A.mischung.forEach(function (n) {
      var t = A.tueren[n - 1];
      var b = document.createElement("button");
      b.type = "button";
      b.className = "door is-" + t.status + (GROSS[n] ? " " + GROSS[n] : "");
      b.dataset.tag = n;
      var lab = t.status === "zu" ? '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>ab ' + t.wochentag + ' </span>' + t.datum
              : t.status === "heute" ? "Heute · Öffnen" : "";
      b.setAttribute("aria-label", "Türchen " + n + (t.status === "zu" ? ", öffnet am " + t.datum : t.status === "heute" ? ", heute" : ", " + t.song.wert));
      // Inhalt künftiger Türen gar nicht erst ins HTML schreiben
      var innen = t.status === "zu" ? "" :
        '<span class="di-num">' + ("0" + n).slice(-2) + '</span><span class="di-song">' + phs(t.song) + '</span><span class="di-by">von ' + phs(t.person) + '</span><span class="di-play">' + ADVENT_ICON("play") + ' Anhören</span>';
      b.innerHTML = '<span class="door-in">' + innen + '</span>' +
        '<span class="door-front"><span class="df-num">' + n + '</span><span class="df-lab">' + lab + '</span></span>';
      grid.appendChild(b);
    });

    if (A.offen && A.tueren[A.offen - 1] && A.tueren[A.offen - 1].status !== "zu") {
      grid.querySelector('[data-tag="' + A.offen + '"]').classList.add("is-offen"); zeige(A.offen);
    }
  }

  var toast = document.getElementById("toast"), tt;
  grid.addEventListener("click", function (e) {
    var b = e.target.closest(".door"); if (!b || !A) return;
    var n = +b.dataset.tag, t = A.tueren[n - 1];
    if (t.status === "zu") {
      b.classList.remove("wackeln"); void b.offsetWidth; b.classList.add("wackeln");
      toast.textContent = "Noch zu – Tür " + n + " öffnet am " + t.wochentag + " " + t.datum + " um " + A.oeffnet_um;
      toast.classList.add("zeigen"); clearTimeout(tt); tt = setTimeout(function () { toast.classList.remove("zeigen"); }, 2600);
      return;
    }
    if (t.status === "heute" && !b.classList.contains("is-offen")) {
      b.classList.add("is-offen");          // erst die Tür aufklappen, dann den Inhalt zeigen
      setTimeout(function () { zeige(n); }, 650);
      return;
    }
    zeige(n);
  });

  function zeige(n) {
    var t = A.tueren[n - 1]; aktuell = n;
    document.getElementById("dlg-num").textContent = ("0" + n).slice(-2);
    document.getElementById("dlg-datum").textContent = "Türchen · " + t.wochentag + " " + t.datum;
    setz("dlg-song", t.song);
    setz("dlg-artist", { wert: t.kuenstler.wert + (t.erschienen ? " · " + t.erschienen : ""), ph: t.kuenstler.ph });
    setz("dlg-person", t.person);
    setz("dlg-rolle", { wert: "· " + t.rolle.wert, ph: t.rolle.ph });
    document.getElementById("dlg-ava").textContent = t.person.ph ? ("0" + n).slice(-2) : t.person.wert.charAt(0).toUpperCase();
    setz("dlg-text", t.text);
    var ph = t.song.ph || t.kuenstler.ph || t.person.ph || t.text.ph || !t.links.length;
    document.getElementById("dlg-ph").hidden = !ph;
    document.getElementById("dlg-links").innerHTML = t.links.length ? t.links.map(function (l, i) {
      return '<a class="btn ' + (i ? "btn-ghost" : "btn-red") + '" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + (i ? ADVENT_ICON("ext") : ADVENT_ICON("play")) + esc(l.dienst) + '</a>';
    }).join("") : '<span class="chip chip--ph">Links folgen</span>';
    document.getElementById("dlg-prev").disabled = n <= 1;
    document.getElementById("dlg-next").disabled = n >= Math.min(A.heute, 24);
    if (!dlg.open) dlg.showModal();
  }
  document.getElementById("dlg-prev").onclick = function () { zeige(aktuell - 1); };
  document.getElementById("dlg-next").onclick = function () { zeige(aktuell + 1); };
  dlg.addEventListener("click", function (e) { if (e.target === dlg || e.target.closest("[data-zu]")) dlg.close(); });
})();
</script>
</body>
</html>
